[package]
name = "TurnOFFGPUI"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "turnoff_gpui"
path = "src/lib.rs"

[[bin]]
name = "TurnOFFGPUI"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.11"
chrono = "0.4"
rust-embed = "8"
usvg = { version = "0.46", default-features = false }

[dev-dependencies]
gpui-kit = { version = "0.11", features = ["test-support"] }
resvg = { version = "0.46", default-features = false }

# Свой код — чуть оптимизирован, но остаётся отладочным и быстро компилируется.
[profile.dev]
opt-level = 1

# Зависимости (gpui, resvg, usvg, tiny-skia) — полностью оптимизированы даже
# в dev: без этого растеризация и отрисовка в отладке в десятки раз медленнее.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1

[package.metadata.packager]
product-name = "TurnOFFGPUI"
identifier = "com.pavellabushev.turnoffgpui"
before-packaging-command = "cargo build --release"
resources = ["assets"]
