<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0e2a"/>
      <stop offset="40%" stop-color="#1d1448"/>
      <stop offset="75%" stop-color="#35236b"/>
      <stop offset="100%" stop-color="#4a2c8a"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffde8" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#fffde8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fffde8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moonBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf2"/>
      <stop offset="60%" stop-color="#f9ecc0"/>
      <stop offset="100%" stop-color="#ecd18a"/>
    </linearGradient>
    <radialGradient id="nebula1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d3fd6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#6d3fd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3f6fd6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3f6fd6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="starTail" gradientUnits="userSpaceOnUse" x1="150" y1="70" x2="100" y2="110">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Небо -->
  <rect width="480" height="440" fill="url(#nightSky)"/>

  <!-- Тёплая дымка у горизонта -->
  <ellipse cx="240" cy="250" rx="360" ry="85" fill="#5a3a9e" opacity="0.28"/>

  <!-- Небулы -->
  <circle cx="120" cy="160" r="140" fill="url(#nebula1)"/>
  <circle cx="390" cy="130" r="120" fill="url(#nebula2)"/>

  <!-- Звёзды -->
  <g fill="#ffffff">
    <circle cx="40" cy="60" r="1" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="85" r="0.8" opacity="0.6"><animate attributeName="opacity" values="0.6;0.12;0.6" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="50" r="1.3" opacity="0.9"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="215" cy="75" r="0.9" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="55" r="1.1" opacity="0.85"><animate attributeName="opacity" values="0.85;0.25;0.85" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="45" r="0.8" opacity="0.65"><animate attributeName="opacity" values="0.65;0.18;0.65" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="120" r="1.2" opacity="0.7"><animate attributeName="opacity" values="0.7;0.18;0.7" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="145" r="0.7" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="195" cy="115" r="1.4" opacity="0.8"><animate attributeName="opacity" values="0.8;0.25;0.8" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="100" r="0.8" opacity="0.55"><animate attributeName="opacity" values="0.55;0.12;0.55" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="305" cy="65" r="1" opacity="0.65"><animate attributeName="opacity" values="0.65;0.15;0.65" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="425" cy="60" r="1.2" opacity="0.85"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="105" r="0.9" opacity="0.6"><animate attributeName="opacity" values="0.6;0.12;0.6" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="175" r="0.8" opacity="0.55"><animate attributeName="opacity" values="0.55;0.12;0.55" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="180" r="1" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="155" r="0.7" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="130" r="1.1" opacity="0.75"><animate attributeName="opacity" values="0.75;0.2;0.75" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="185" r="0.9" opacity="0.6"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="4.3s" repeatCount="indefinite"/></circle>
    <circle cx="425" cy="160" r="1.3" opacity="0.8"><animate attributeName="opacity" values="0.8;0.25;0.8" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="195" r="0.8" opacity="0.6"><animate attributeName="opacity" values="0.6;0.12;0.6" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="215" r="1.1" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="205" cy="205" r="0.9" opacity="0.55"><animate attributeName="opacity" values="0.55;0.12;0.55" dur="3.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Звёзды-искры -->
  <g fill="#ffffff">
    <path d="M70,73 L71.6,78.4 L77,80 L71.6,81.6 L70,87 L68.4,81.6 L63,80 L68.4,78.4 Z" opacity="0.9"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="4.5s" repeatCount="indefinite"/></path>
    <path d="M285,89.5 L286.2,93.8 L290.5,95 L286.2,96.2 L285,100.5 L283.8,96.2 L279.5,95 L283.8,93.8 Z" opacity="0.85"><animate attributeName="opacity" values="0.85;0.2;0.85" dur="3.6s" repeatCount="indefinite"/></path>
    <path d="M445,159 L446.4,163.6 L451,165 L446.4,166.4 L445,171 L443.6,166.4 L439,165 L443.6,163.6 Z" opacity="0.8"><animate attributeName="opacity" values="0.8;0.25;0.8" dur="5.2s" repeatCount="indefinite"/></path>
  </g>

  <!-- Падающая звезда -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.1;0.55;0.6;0.85;0.9" dur="8s" repeatCount="indefinite"/>
    <line x1="150" y1="70" x2="100" y2="110" stroke="url(#starTail)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="100" cy="110" r="1.8" fill="#ffffff"/>
  </g>

  <!-- Луна -->
  <circle cx="360" cy="120" r="70" fill="url(#moonGlow)"/>
  <circle cx="360" cy="120" r="30" fill="url(#moonBody)"/>
  <g fill="#e0c98a" opacity="0.35">
    <circle cx="350" cy="108" r="4"/>
    <circle cx="368" cy="125" r="3.5"/>
    <circle cx="358" cy="95" r="2.8"/>
    <circle cx="374" cy="112" r="2.2"/>
    <circle cx="348" cy="132" r="2.5"/>
  </g>
</svg>