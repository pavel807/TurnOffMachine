<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="daySky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fbdea"/>
      <stop offset="55%" stop-color="#c6ddf2"/>
      <stop offset="100%" stop-color="#e8dcc4"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunBody" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#ffefad"/>
      <stop offset="70%" stop-color="#ffc74e"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </radialGradient>
    <radialGradient id="cloudGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dfe9f3"/>
    </radialGradient>
  </defs>

  <!-- Небо -->
  <rect width="480" height="440" fill="url(#daySky)"/>

  <!-- Солнце -->
  <circle cx="360" cy="115" r="68" fill="url(#sunGlow)"/>
  <g stroke="#fff3c4" stroke-width="5" stroke-linecap="round" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="0 360 115" to="360 360 115" dur="120s" repeatCount="indefinite"/>
    <line x1="360" y1="115" x2="360" y2="53"/>
    <line x1="360" y1="115" x2="360" y2="177"/>
    <line x1="360" y1="115" x2="298" y2="115"/>
    <line x1="360" y1="115" x2="422" y2="115"/>
    <line x1="360" y1="115" x2="316" y2="71"/>
    <line x1="360" y1="115" x2="404" y2="71"/>
    <line x1="360" y1="115" x2="316" y2="159"/>
    <line x1="360" y1="115" x2="404" y2="159"/>
  </g>
  <circle cx="360" cy="115" r="26" fill="url(#sunBody)"/>

  <!-- Облака -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 16 0; 0 0" dur="48s" repeatCount="indefinite"/>
    <ellipse cx="110" cy="110" rx="34" ry="15" fill="url(#cloudGrad)" opacity="0.95"/>
    <ellipse cx="90" cy="104" rx="21" ry="12" fill="url(#cloudGrad)" opacity="0.9"/>
    <ellipse cx="130" cy="104" rx="23" ry="13" fill="url(#cloudGrad)" opacity="0.9"/>
    <ellipse cx="110" cy="96" rx="17" ry="10" fill="url(#cloudGrad)" opacity="0.95"/>
  </g>
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0; -12 0; 0 0" dur="60s" repeatCount="indefinite"/>
    <ellipse cx="250" cy="170" rx="28" ry="12" fill="url(#cloudGrad)"/>
    <ellipse cx="232" cy="165" rx="17" ry="9" fill="url(#cloudGrad)"/>
    <ellipse cx="268" cy="165" rx="18" ry="10" fill="url(#cloudGrad)"/>
    <ellipse cx="250" cy="158" rx="13" ry="8" fill="url(#cloudGrad)"/>
  </g>
  <g opacity="0.75">
    <ellipse cx="430" cy="75" rx="24" ry="10" fill="url(#cloudGrad)"/>
    <ellipse cx="415" cy="71" rx="14" ry="7" fill="url(#cloudGrad)"/>
    <ellipse cx="445" cy="71" rx="15" ry="8" fill="url(#cloudGrad)"/>
  </g>

  <!-- Птицы -->
  <g stroke="#55607a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <path d="M280,60 q7,-9 14,0 q7,-9 14,0"/>
    <path d="M320,72 q5,-7 11,0 q5,-7 11,0"/>
    <path d="M265,80 q5,-6 10,0 q5,-6 10,0" opacity="0.7"/>
  </g>

  <!-- Тёплая дымка у горизонта -->
  <ellipse cx="240" cy="240" rx="340" ry="70" fill="#f3e4c2" opacity="0.4"/>

  <!-- Горы дневные -->
  <polygon points="0,220 30,175 62,200 98,165 135,195 172,160 208,188 246,155 283,183 320,160 356,188 393,168 428,195 450,180 480,195 480,440 0,440" fill="#cfbfa3"/>
  <polygon points="0,245 34,200 70,230 108,185 145,215 183,185 220,212 258,182 295,210 332,185 368,212 405,190 450,215 480,205 480,440 0,440" fill="#b3a183"/>
  <polygon points="0,272 30,228 60,255 95,212 128,243 163,208 198,237 233,208 268,237 303,210 338,240 372,215 405,243 438,220 480,232 480,440 0,440" fill="#95805e"/>

  <!-- Гряда переднего плана -->
  <path d="M0,265 C40,258 80,265 120,260 C160,255 200,263 240,258 C280,253 320,261 360,257 C400,253 440,260 480,256 L480,440 L0,440 Z" fill="#7a6643"/>

  <!-- Ели дневные -->
  <g fill="#4b3b25">
    <polygon points="15,234 6,258 24,258"/><polygon points="15,245 4,270 26,270"/>
    <polygon points="45,234 36,258 54,258"/><polygon points="45,245 34,270 56,270"/>
    <polygon points="75,234 66,258 84,258"/><polygon points="75,245 64,270 86,270"/>
    <polygon points="105,234 96,258 114,258"/><polygon points="105,245 94,270 116,270"/>
    <polygon points="135,234 126,258 144,258"/><polygon points="135,245 124,270 146,270"/>
    <polygon points="165,234 156,258 174,258"/><polygon points="165,245 154,270 176,270"/>
    <polygon points="195,234 186,258 204,258"/><polygon points="195,245 184,270 206,270"/>
    <polygon points="225,234 216,258 234,258"/><polygon points="225,245 214,270 236,270"/>
    <polygon points="255,234 246,258 264,258"/><polygon points="255,245 244,270 266,270"/>
    <polygon points="285,234 276,258 294,258"/><polygon points="285,245 274,270 296,270"/>
    <polygon points="315,234 306,258 324,258"/><polygon points="315,245 304,270 326,270"/>
    <polygon points="345,234 336,258 354,258"/><polygon points="345,245 334,270 356,270"/>
    <polygon points="375,234 366,258 384,258"/><polygon points="375,245 364,270 386,270"/>
    <polygon points="405,234 396,258 414,258"/><polygon points="405,245 394,270 416,270"/>
    <polygon points="435,234 426,258 444,258"/><polygon points="435,245 424,270 446,270"/>
    <polygon points="465,234 456,258 474,258"/><polygon points="465,245 454,270 476,270"/>
