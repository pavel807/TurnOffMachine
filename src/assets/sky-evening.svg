<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d113f"/>
      <stop offset="35%" stop-color="#4a1f4f"/>
      <stop offset="60%" stop-color="#8a2f4e"/>
      <stop offset="80%" stop-color="#d45a3f"/>
      <stop offset="100%" stop-color="#f59a5e"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8a4d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff8a4d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunBody" cx="42%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ffe3b0"/>
      <stop offset="60%" stop-color="#ff9c4d"/>
      <stop offset="100%" stop-color="#f26a3c"/>
    </radialGradient>
    <radialGradient id="cloudGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#7a4060"/>
      <stop offset="100%" stop-color="#4a2640"/>
    </radialGradient>
  </defs>

  <rect width="480" height="440" fill="url(#sky)"/>

  <!-- Первые звёзды -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="60" cy="50" r="1"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="35" r="1.1"><animate attributeName="opacity" values="0.55;0.18;0.55" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="60" r="0.9"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="95" r="0.8" opacity="0.4"/>
    <circle cx="180" cy="110" r="0.9" opacity="0.45"/>
  </g>

  <!-- Тёплая дымка у горизонта -->
  <ellipse cx="240" cy="255" rx="360" ry="80" fill="#e8754a" opacity="0.4"/>

  <!-- Низкое вечернее солнце -->
  <circle cx="330" cy="215" r="100" fill="url(#sunGlow)"/>
  <circle cx="330" cy="215" r="26" fill="url(#sunBody)"/>
  <circle cx="330" cy="215" r="32" fill="none" stroke="#ffcf9e" stroke-width="2" opacity="0.35"/>

  <!-- Сумеречные облака -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0; 12 0; 0 0" dur="50s" repeatCount="indefinite"/>
    <ellipse cx="110" cy="120" rx="36" ry="14" fill="url(#cloudGrad)"/>
    <ellipse cx="90" cy="114" rx="22" ry="11" fill="url(#cloudGrad)"/>
    <ellipse cx="130" cy="114" rx="24" ry="12" fill="url(#cloudGrad)"/>
    <ellipse cx="110" cy="106" rx="18" ry="9" fill="url(#cloudGrad)"/>
  </g>
  <g opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0 0; -10 0; 0 0" dur="62s" repeatCount="indefinite"/>
    <ellipse cx="280" cy="170" rx="30" ry="12" fill="url(#cloudGrad)"/>
    <ellipse cx="260" cy="165" rx="18" ry="9" fill="url(#cloudGrad)"/>
    <ellipse cx="298" cy="165" rx="19" ry="10" fill="url(#cloudGrad)"/>
    <ellipse cx="280" cy="158" rx="14" ry="8" fill="url(#cloudGrad)"/>
  </g>
  <g opacity="0.6">
    <ellipse cx="420" cy="85" rx="24" ry="9" fill="url(#cloudGrad)"/>
    <ellipse cx="405" cy="81" rx="14" ry="7" fill="url(#cloudGrad)"/>
  </g>
</svg>