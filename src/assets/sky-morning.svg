<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#584a86"/>
      <stop offset="40%" stop-color="#a86a70"/>
      <stop offset="70%" stop-color="#e2915f"/>
      <stop offset="100%" stop-color="#f6d2a0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffdf9e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffdf9e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunBody" cx="42%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fff2d0"/>
      <stop offset="60%" stop-color="#ffcf6e"/>
      <stop offset="100%" stop-color="#ff9f40"/>
    </radialGradient>
    <radialGradient id="cloudGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fff0e0"/>
      <stop offset="100%" stop-color="#f2d4bc"/>
    </radialGradient>
  </defs>

  <rect width="480" height="440" fill="url(#sky)"/>

  <!-- Угасающие звёзды -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="55" cy="45" r="1"/>
    <circle cx="150" cy="70" r="0.9"/>
    <circle cx="240" cy="40" r="1.1"/>
  </g>

  <!-- Тёплая дымка у горизонта -->
  <ellipse cx="240" cy="255" rx="360" ry="80" fill="#f7c98f" opacity="0.45"/>

  <!-- Низкое утреннее солнце -->
  <circle cx="330" cy="208" r="95" fill="url(#sunGlow)"/>
  <circle cx="330" cy="208" r="28" fill="url(#sunBody)"/>
  <circle cx="330" cy="208" r="34" fill="none" stroke="#ffe3a8" stroke-width="2" opacity="0.35"/>

  <!-- Рассветные облака -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0; 14 0; 0 0" dur="52s" repeatCount="indefinite"/>
    <ellipse cx="105" cy="105" rx="34" ry="14" fill="url(#cloudGrad)"/>
    <ellipse cx="86" cy="100" rx="20" ry="11" fill="url(#cloudGrad)"/>
    <ellipse cx="124" cy="100" rx="22" ry="12" fill="url(#cloudGrad)"/>
    <ellipse cx="105" cy="93" rx="16" ry="9" fill="url(#cloudGrad)"/>
  </g>
  <g opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0 0; -10 0; 0 0" dur="58s" repeatCount="indefinite"/>
    <ellipse cx="285" cy="150" rx="26" ry="11" fill="url(#cloudGrad)"/>
    <ellipse cx="268" cy="146" rx="16" ry="8" fill="url(#cloudGrad)"/>
    <ellipse cx="302" cy="146" rx="17" ry="9" fill="url(#cloudGrad)"/>
  </g>
  <g opacity="0.55">
    <ellipse cx="435" cy="120" rx="22" ry="9" fill="url(#cloudGrad)"/>
    <ellipse cx="420" cy="117" rx="13" ry="6" fill="url(#cloudGrad)"/>
  </g>
</svg>